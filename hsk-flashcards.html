<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HSK 5–6 Flashcards</title>
<style>
  :root{
    --paper:#F7F3E8;
    --paper-2:#EFE9D8;
    --ink:#2B2620;
    --ink-soft:#6B6252;
    --line:#C9BFA0;
    --seal:#AE3A2E;
    --seal-soft:#D9847A;
    --good:#5B7A5B;
    --again:#A8493D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  .hanzi{
    font-family:"Songti SC","Noto Serif SC","STSong","PingFang SC", serif;
  }

  header{
    padding:18px 20px 12px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  header h1{
    margin:0;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  header .sub{
    margin-top:3px;
    font-size:12px;
    color:var(--ink-soft);
  }

  .controls{
    display:flex;
    gap:8px;
    justify-content:center;
    padding:10px 16px;
    flex-wrap:wrap;
  }
  .segmented{
    display:inline-flex;
    background:var(--paper-2);
    border-radius:8px;
    padding:3px;
    gap:2px;
  }
  .segmented button{
    border:none;
    background:transparent;
    padding:6px 12px;
    font-size:12.5px;
    border-radius:6px;
    color:var(--ink-soft);
    font-family:inherit;
  }
  .segmented button.active{
    background:var(--paper);
    color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,0.12);
    font-weight:600;
  }
  .icon-btn{
    border:none;
    background:var(--paper-2);
    color:var(--ink-soft);
    width:30px; height:30px;
    border-radius:8px;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:14px 20px 24px;
    gap:14px;
  }

  .progress-row{
    width:100%;
    max-width:360px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
    padding:0 2px;
  }
  .progress-bar{
    width:100%;
    max-width:360px;
    height:3px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--seal);
    width:0%;
  }

  /* Flip card - tianzige grid styling */
  .card-wrap{
    width:100%;
    max-width:320px;
    aspect-ratio:1/1;
    position:relative;
    margin-top:10px;
  }
  .card{
    width:100%;
    height:100%;
    background:var(--paper);
    border:1.5px solid var(--seal-soft);
    border-radius:4px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 10px rgba(43,38,32,0.08);
  }
  .card::before, .card::after{
    content:"";
    position:absolute;
    background:var(--seal-soft);
    opacity:0.45;
  }
  .card::before{ /* vertical dashed via gradient */
    left:50%; top:0; bottom:0; width:1px;
    background:repeating-linear-gradient(to bottom, var(--seal-soft) 0 6px, transparent 6px 12px);
    opacity:0.5;
  }
  .card::after{
    top:50%; left:0; right:0; height:1px;
    background:repeating-linear-gradient(to right, var(--seal-soft) 0 6px, transparent 6px 12px);
    opacity:0.5;
  }
  .level-tag{
    position:absolute;
    top:10px; left:10px;
    font-size:10.5px;
    color:var(--ink-soft);
    background:var(--paper-2);
    padding:2px 7px;
    border-radius:5px;
    z-index:2;
  }
  .char{
    font-size:104px;
    line-height:1;
    color:var(--ink);
    z-index:1;
    user-select:none;
  }
  .reveal{
    width:100%;
    max-width:320px;
    min-height:64px;
    text-align:center;
  }
  .pinyin{
    font-size:20px;
    color:var(--seal);
    font-weight:600;
    margin-bottom:6px;
  }
  .meaning{
    font-size:15px;
    color:var(--ink);
    line-height:1.4;
  }
  .tap-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .grade-row{
    width:100%;
    max-width:360px;
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  .grade-btn{
    flex:1;
    border:none;
    border-radius:9px;
    padding:12px 4px;
    font-size:13.5px;
    font-weight:600;
    font-family:inherit;
  }
  .grade-again{ background:#F1DEDA; color:var(--again); }
  .grade-good{ background:#E4EBE1; color:var(--good); }
  .grade-easy{ background:#DCE8E8; color:#3E6E6E; }

  /* Quiz mode */
  .quiz-char{
    font-size:88px;
    margin:14px 0 6px;
    text-align:center;
  }
  .quiz-pinyin{
    font-size:15px;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:18px;
  }
  .choices{
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .choice-btn{
    text-align:left;
    padding:13px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:14px;
    color:var(--ink);
    font-family:inherit;
  }
  .choice-btn.correct{ background:#E4EBE1; border-color:var(--good); color:var(--good); }
  .choice-btn.wrong{ background:#F1DEDA; border-color:var(--again); color:var(--again); }
  .choice-btn.dim{ opacity:0.45; }

  .empty-state{
    text-align:center;
    padding:60px 24px;
    color:var(--ink-soft);
  }
  .empty-state h2{ color:var(--ink); font-size:18px; margin-bottom:8px; }
  .empty-state button{
    margin-top:16px;
    border:none;
    background:var(--seal);
    color:#fff;
    padding:10px 20px;
    border-radius:9px;
    font-size:13.5px;
    font-family:inherit;
    font-weight:600;
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(43,38,32,0.35);
    display:flex; align-items:flex-end;
    z-index:10;
  }
  .sheet{
    width:100%;
    background:var(--paper);
    border-radius:16px 16px 0 0;
    padding:22px 22px 28px;
  }
  .sheet h3{ margin:0 0 14px; font-size:16px; }
  .stat-line{
    display:flex; justify-content:space-between;
    font-size:14px; padding:7px 0;
    border-bottom:1px solid var(--paper-2);
    color:var(--ink-soft);
  }
  .stat-line b{ color:var(--ink); font-weight:600; }
  .sheet button.reset{
    margin-top:18px;
    width:100%;
    border:1px solid var(--again);
    color:var(--again);
    background:transparent;
    padding:11px;
    border-radius:9px;
    font-family:inherit;
    font-size:13.5px;
  }
  .sheet button.close{
    margin-top:10px;
    width:100%;
    border:none;
    background:var(--paper-2);
    color:var(--ink);
    padding:11px;
    border-radius:9px;
    font-family:inherit;
    font-size:13.5px;
  }
  @media (prefers-reduced-motion: no-preference){
    .card, .choice-btn{ transition: background 0.15s ease, border-color 0.15s ease; }
  }
</style>
</head>

<header>
  <h1>HSK 5–6 Flashcards</h1>

</header>

<div class="controls">
  <div class="segmented" id="levelSeg">
    <button data-v="both" class="active">Both</button>

    <button data-v="quiz">Quiz</button>
  </div>
  <button class="icon-btn" id="statsBtn" title="Stats">⋯</button>
</div>

<main id="main"></main>

<div id="overlayRoot"></div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data-holder').textContent);
  const STORAGE_KEY = 'hsk_flashcards_progress_v1';
  const SETTINGS_KEY = 'hsk_flashcards_settings_v1';
  const NEW_CARDS_PER_SESSION = 15;
  const INTERVALS_MS = [
    2*60*1000,        // box 0 -> 1 (Again puts it back near here)
    20*60*1000,       // box 1
    1*24*3600*1000,   // box 2
    3*24*3600*1000,   // box 3
    7*24*3600*1000,   // box 4
    16*24*3600*1000,  // box 5
    35*24*3600*1000   // box 6 (mastered-ish)
  ];

  let progress = loadJSON(STORAGE_KEY, {});
  let settings = loadJSON(SETTINGS_KEY, {level:'both', mode:'flip'});

  function loadJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveProgress(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){} }
  function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }

  function getRec(id){
    if(!progress[id]) progress[id] = {box:0, due:0, seen:0, correct:0};
    return progress[id];
  }

  function levelFiltered(){
    if(settings.level === 'both') return DATA;
    const lv = parseInt(settings.level,10);
    return DATA.filter(d => d.l === lv);
  }

  let queue = [];
  let qi = 0;
  let sessionTotal = 0;
  let flipped = false;

  function buildQueue(){
    const pool = levelFiltered();
    const now = Date.now();
    const due = [];
    const unseen = [];
    pool.forEach((d,idx) => {
      const rec = getRec(idx + '_' + settings.level_key_ignore); // placeholder, replaced below
    });
    // Use stable ids based on hanzi+level to survive filter changes
    const dueList = [];
    const newList = [];
    pool.forEach(d => {
      const id = d.h + '_' + d.l;
      const rec = getRec(id);
      if(rec.seen === 0){
        newList.push(d);
      } else if(rec.due <= now){
        dueList.push({d, overdue: now - rec.due});
      }
    });
    dueList.sort((a,b) => b.overdue - a.overdue);
    shuffle(newList);
    const chosenNew = newList.slice(0, NEW_CARDS_PER_SESSION);
    queue = dueList.map(x => x.d).concat(chosenNew);
    shuffle(queue);
    qi = 0;
    sessionTotal = queue.length;
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
  }

  function idFor(d){ return d.h + '_' + d.l; }

  function grade(d, result){
    const id = idFor(d);
    const rec = getRec(id);
    rec.seen += 1;
    const now = Date.now();
    if(result === 'again'){
      rec.box = 0;
      rec.due = now + INTERVALS_MS[0];
    } else if(result === 'good'){
      rec.correct += 1;
      rec.box = Math.min(rec.box + 1, INTERVALS_MS.length - 1);
      rec.due = now + INTERVALS_MS[rec.box];
    } else if(result === 'easy'){
      rec.correct += 1;
      rec.box = Math.min(rec.box + 2, INTERVALS_MS.length - 1);
      rec.due = now + Math.floor(INTERVALS_MS[rec.box] * 1.4);
    }
    saveProgress();
  }

  function computeStats(){
    const pool = levelFiltered();
    let mastered = 0, seenCount = 0, dueCount = 0;
    const now = Date.now();
    pool.forEach(d => {
      const id = idFor(d);
      const rec = progress[id];
      if(rec && rec.seen > 0){
        seenCount++;
        if(rec.box >= 4) mastered++;
        if(rec.due <= now) dueCount++;
      } else {
        dueCount++; // unseen counts as available
      }
    });
    return {total: pool.length, seenCount, mastered, dueCount};
  }

  function updateSubline(){
    const s = computeStats();
    document.getElementById('subline').textContent =
      s.total + ' words · ' + s.mastered + ' mastered · ' + s.dueCount + ' ready to review';
  }

  function setActiveSeg(container, value){
    Array.from(container.children).forEach(btn => {
      btn.classList.toggle('active', btn.dataset.v === value);
    });
  }

  document.getElementById('levelSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    settings.level = btn.dataset.v;
    saveSettings();
    setActiveSeg(document.getElementById('levelSeg'), settings.level);
    buildQueue();
    render();
  });
  document.getElementById('modeSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    settings.mode = btn.dataset.v;
    saveSettings();
    setActiveSeg(document.getElementById('modeSeg'), settings.mode);
    buildQueue();
    render();
  });
  document.getElementById('statsBtn').addEventListener('click', showStats);

  function showStats(){
    const s = computeStats();
    const root = document.getElementById('overlayRoot');
    root.innerHTML = '';
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML =
      '<div class="sheet">' +
      '<h3>Your progress</h3>' +
      '<div class="stat-line"><span>Words in this set</span><b>' + s.total + '</b></div>' +
      '<div class="stat-line"><span>Started</span><b>' + s.seenCount + '</b></div>' +
      '<div class="stat-line"><span>Mastered</span><b>' + s.mastered + '</b></div>' +
      '<div class="stat-line"><span>Ready to review now</span><b>' + s.dueCount + '</b></div>' +
      '<button class="reset" id="resetBtn">Reset progress for this set</button>' +
      '<button class="close" id="closeSheet">Close</button>' +
      '</div>';
    root.appendChild(overlay);
    overlay.addEventListener('click', ev => { if(ev.target === overlay) root.innerHTML = ''; });
    document.getElementById('closeSheet').addEventListener('click', () => root.innerHTML = '');
    document.getElementById('resetBtn').addEventListener('click', () => {
      levelFiltered().forEach(d => { delete progress[idFor(d)]; });
      saveProgress();
      root.innerHTML = '';
      buildQueue();
      render();
    });
  }

  function render(){
    updateSubline();
    const main = document.getElementById('main');
    main.innerHTML = '';
    if(qi >= queue.length){
      renderEmpty(main);
      return;
    }
    if(settings.mode === 'flip'){
      renderFlip(main);
    } else {
      renderQuiz(main);
    }
  }

  function renderEmpty(main){
    const div = document.createElement('div');
    div.className = 'empty-state';
    const hasAny = levelFiltered().length > 0;
    div.innerHTML = hasAny
      ? '<h2>All caught up</h2><p>No cards due right now. Come back later, or review ahead of schedule.</p><button id="reviewAheadBtn">Review anyway</button>'
      : '<h2>Nothing here yet</h2><p>Try a different level.</p>';
    main.appendChild(div);
    const btn = document.getElementById('reviewAheadBtn');
    if(btn){
      btn.addEventListener('click', () => {
        const pool = levelFiltered();
        shuffle(pool);
        queue = pool.slice(0, 20);
        qi = 0;
        sessionTotal = queue.length;
        render();
      });
    }
  }

  function progressHeader(){
    const pct = sessionTotal ? Math.round((qi / sessionTotal) * 100) : 0;
    const wrap = document.createElement('div');
    wrap.style.width = '100%';
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.alignItems = 'center';
    wrap.style.gap = '6px';
    wrap.innerHTML =
      '<div class="progress-row"><span>' + (qi+1) + ' / ' + sessionTotal + '</span><span>' + settings.level.toUpperCase() + '</span></div>' +
      '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>';
    return wrap;
  }

  function renderFlip(main){
    flipped = false;
    const d = queue[qi];
    main.appendChild(progressHeader());

    const cardWrap = document.createElement('div');
    cardWrap.className = 'card-wrap';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<span class="level-tag">HSK ' + d.l + '</span>' +
      '<span class="char hanzi">' + d.h + '</span>';
    cardWrap.appendChild(card);
    main.appendChild(cardWrap);

    const reveal = document.createElement('div');
    reveal.className = 'reveal';
    reveal.innerHTML = '<div class="tap-hint">Tap the card to reveal</div>';
    main.appendChild(reveal);

    const gradeRow = document.createElement('div');
    gradeRow.className = 'grade-row';
    gradeRow.style.visibility = 'hidden';
    gradeRow.innerHTML =
      '<button class="grade-btn grade-again" data-g="again">Again</button>' +
      '<button class="grade-btn grade-good" data-g="good">Good</button>' +
      '<button class="grade-btn grade-easy" data-g="easy">Easy</button>';
    main.appendChild(gradeRow);

    card.addEventListener('click', () => {
      if(flipped) return;
      flipped = true;
      reveal.innerHTML =
        '<div class="pinyin">' + d.p + '</div>' +
        '<div class="meaning">' + escapeHtml(d.m) + '</div>';
      gradeRow.style.visibility = 'visible';
    });

    gradeRow.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if(!btn || !flipped) return;
      grade(d, btn.dataset.g);
      qi++;
      render();
    });
  }

  function renderQuiz(main){
    const d = queue[qi];
    main.appendChild(progressHeader());

    const charDiv = document.createElement('div');
    charDiv.className = 'quiz-char hanzi';
    charDiv.textContent = d.h;
    main.appendChild(charDiv);

    const lvTag = document.createElement('div');
    lvTag.className = 'quiz-pinyin';
    lvTag.textContent = 'HSK ' + d.l + ' · choose the meaning';
    main.appendChild(lvTag);

    const pool = levelFiltered().filter(x => x.h !== d.h);
    shuffle(pool);
    const distractors = pool.slice(0,3).map(x => x.m);
    const options = distractors.concat([d.m]);
    shuffle(options);

    const choicesDiv = document.createElement('div');
    choicesDiv.className = 'choices';
    options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'choice-btn';
      b.textContent = opt;
      choicesDiv.appendChild(b);
    });
    main.appendChild(choicesDiv);

    let answered = false;
    choicesDiv.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if(!btn || answered) return;
      answered = true;
      const isCorrect = btn.textContent === d.m;
      Array.from(choicesDiv.children).forEach(b => {
        if(b.textContent === d.m) b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
        else b.classList.add('dim');
      });
      grade(d, isCorrect ? 'good' : 'again');
      setTimeout(() => {
        qi++;
        render();
      }, 700);
    });
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // init
  setActiveSeg(document.getElementById('levelSeg'), settings.level);
  setActiveSeg(document.getElementById('modeSeg'), settings.mode);
  buildQueue();
  render();
})();
</script>
</body>
</html>
